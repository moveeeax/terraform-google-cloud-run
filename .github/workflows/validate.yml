name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
          tofu_version: 1.13.8

      - name: fmt
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -backend=false

      - name: validate
        run: tofu validate

      - name: test
        run: tofu test

      - name: validate example
        working-directory: examples/basic
        run: |
          tofu init -backend=false
          tofu validate

  # The module claims a minimum google version. Prove it, so an argument that
  # only exists in a newer provider cannot silently break consumers who resolve
  # the floor of the constraint.
  minimum-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
          tofu_version: 1.13.8

      - name: pin google to the declared minimum and validate
        run: |
          cat > override.tf <<'EOF'
          terraform {
            required_providers {
              google = {
                source  = "hashicorp/google"
                version = "6.0.0"
              }
            }
          }
          EOF
          tofu init -backend=false -upgrade
          tofu validate
          tofu test
